#Placeholder for ROOT nic
subnet 172.17.21.0 netmask 255.255.255.0 {}
subnet 172.17.20.0 netmask 255.255.255.0 {}

#VLAN 401
class "VLAN401" { match if binary-to-ascii(10,16,"",substring(option agent.circuit-id,2,2)) = "410"; }


### VLAN 401 (172.23.0.0/23) ###

subnet 172.23.0.0 netmask 255.255.254.0 {
	
#	allow members of                "VLAN401";
        option routers                  172.23.1.254;
        option subnet-mask              255.255.254.0;
#       option nis-domain               "al-arafahbank.com";
#       option domain-name              "al-arafahbank.com";
        option domain-name-servers      172.17.21.11,172.17.21.12;
#         option domain-name-servers      10.20.1.101, 10.20.1.102;
        option time-offset              -18000; 
# Eastern Standard Time
        range dynamic-bootp 172.23.1.224 172.23.1.239;
        default-lease-time 21600;
        max-lease-time 43200;


